name: Google ACK (android17-6.18) serie 6.18

# Trilha nova (docs/google-mainline-vendor-plan.md, patches-6.18/).
# Gates de push para a serie rebaseada sobre a base oficial da Google
# fixada abaixo:
#  * rebase-cost: todo patch em patches-6.18/ tem de aplicar limpo,
#    em ordem; qualquer FAIL derruba o job.
#  * kernel-build: a serie aplicada tem de configurar (fragmento do
#    port via tools/configure_kernel.sh) e compilar/linkar o Image.
# Nao publica no branch ci-artifacts (isso continua sendo do workflow
# dts-validate); logs vao como artefatos da run.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/60994951-kernel
    paths:
      - "patches-6.18/**"
      - "config/**"
      - "tools/configure_kernel.sh"
      - ".github/workflows/google-mainline.yml"

env:
  BASE_REPO: https://github.com/aosp-mirror/kernel_common
  BASE_COMMIT: 1afe39edbe66c201d26f23f2e3396583238f6842

jobs:
  rebase-cost:
    name: Apply-check da serie na base Google
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Kernel project
        uses: actions/checkout@v4

      - name: Clone base Google (commit fixado)
        run: |
          set -o pipefail
          git clone --depth 1 "$BASE_REPO" basegoogle
          cd basegoogle
          git fetch --depth 1 origin "$BASE_COMMIT"
          git checkout "$BASE_COMMIT"
          git rev-parse HEAD
          head -5 Makefile

      - name: Apply-check sequencial da serie 6.18
        run: |
          set -o pipefail
          cd basegoogle
          : > ../rebase-cost.log
          for p in ../patches-6.18/[0-9][0-9][0-9][0-9]-*.patch; do
            n=$(basename "$p")
            if err=$(git apply --check "$p" 2>&1); then
              git apply "$p"
              echo "CLEAN $n" | tee -a ../rebase-cost.log
            else
              echo "FAIL  $n" | tee -a ../rebase-cost.log
              echo "$err" | head -4 | sed 's/^/      /' | tee -a ../rebase-cost.log
            fi
          done
          cleans=$(grep -c '^CLEAN' ../rebase-cost.log || true)
          fails=$(grep -c '^FAIL' ../rebase-cost.log || true)
          echo "clean: $cleans" | tee -a ../rebase-cost.log
          echo "fail:  $fails" | tee -a ../rebase-cost.log
          if [ "$fails" != "0" ]; then
            echo "serie 6.18 nao aplica limpa na base fixada" >&2
            exit 1
          fi
          git diff --check | tee -a ../rebase-cost.log

      - name: Archive rebase cost log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-rebase-cost
          path: rebase-cost.log

  kernel-build:
    name: Kernel build 6.18 (port Khaje)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Kernel project
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libelf-dev

      - name: Clone base Google (commit fixado)
        run: |
          set -o pipefail
          git clone --depth 1 "$BASE_REPO" basegoogle
          cd basegoogle
          git fetch --depth 1 origin "$BASE_COMMIT"
          git checkout "$BASE_COMMIT"
          git rev-parse HEAD

      - name: Apply local patch series 6.18
        run: |
          set -o pipefail
          cd basegoogle
          for p in ../patches-6.18/[0-9][0-9][0-9][0-9]-*.patch; do
            git apply --check "$p" || exit 1
            git apply "$p" || exit 1
          done

      - name: Configure (defconfig GKI + fragmento Khaje)
        run: |
          set -o pipefail
          sh tools/configure_kernel.sh basegoogle 2>&1 | tee basegoogle/configure.log

      - name: Build kernel image
        run: |
          set -o pipefail
          cd basegoogle
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image \
            2>&1 | tee kernel-build-618.log

      - name: Archive build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-kernel-build-logs
          path: |
            basegoogle/kernel-build-618.log
            basegoogle/configure.log
            basegoogle/.config

      # Same reporting channel as the 6.12 track: the log tails land in a
      # GitHub issue, readable from environments that cannot download
      # Actions logs/artifacts.
      - name: Publish build summary as issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          grep -hE 'FALTANDO|^ERRO|error:|Error ' basegoogle/configure.log \
              basegoogle/kernel-build-618.log > basegoogle/falhas.txt 2>/dev/null \
              || echo "(nenhuma falha grepada)" > basegoogle/falhas.txt
          bash tools/ci_publish_report.sh \
            "CI: relatorio de build do kernel 6.18 (port Khaje)" ci-report \
            basegoogle/falhas.txt basegoogle/configure.log \
            basegoogle/kernel-build-618.log || true
