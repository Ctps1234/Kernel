name: Google ACK (android17-6.18) serie 6.18

# Trilha nova (docs/google-mainline-vendor-plan.md, patches-6.18/).
# Gates de push para a serie rebaseada sobre a base oficial da Google
# fixada abaixo:
#  * rebase-cost: todo patch em patches-6.18/ tem de aplicar limpo,
#    em ordem; qualquer FAIL derruba o job.
#  * kernel-build: a serie aplicada tem de configurar (fragmento do
#    port via tools/configure_kernel.sh) e compilar/linkar o Image.
# Nao publica no branch ci-artifacts (isso continua sendo do workflow
# dts-validate); logs vao como artefatos da run.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/60994951-kernel
    paths:
      - "patches-6.18/**"
      - "config/**"
      - "tools/configure_kernel.sh"
      - ".github/workflows/google-mainline.yml"

env:
  BASE_REPO: https://github.com/aosp-mirror/kernel_common
  BASE_COMMIT: 1afe39edbe66c201d26f23f2e3396583238f6842

jobs:
  rebase-cost:
    name: Apply-check da serie na base Google
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Kernel project
        uses: actions/checkout@v4

      - name: Clone base Google (commit fixado)
        run: |
          set -o pipefail
          git clone --depth 1 "$BASE_REPO" basegoogle
          cd basegoogle
          git fetch --depth 1 origin "$BASE_COMMIT"
          git checkout "$BASE_COMMIT"
          git rev-parse HEAD
          head -5 Makefile

      - name: Apply-check sequencial da serie 6.18
        run: |
          set -o pipefail
          cd basegoogle
          : > ../rebase-cost.log
          for p in ../patches-6.18/[0-9][0-9][0-9][0-9]-*.patch; do
            n=$(basename "$p")
            if err=$(git apply --check "$p" 2>&1); then
              git apply "$p"
              echo "CLEAN $n" | tee -a ../rebase-cost.log
            else
              echo "FAIL  $n" | tee -a ../rebase-cost.log
              echo "$err" | head -4 | sed 's/^/      /' | tee -a ../rebase-cost.log
            fi
          done
          cleans=$(grep -c '^CLEAN' ../rebase-cost.log || true)
          fails=$(grep -c '^FAIL' ../rebase-cost.log || true)
          echo "clean: $cleans" | tee -a ../rebase-cost.log
          echo "fail:  $fails" | tee -a ../rebase-cost.log
          if [ "$fails" != "0" ]; then
            echo "serie 6.18 nao aplica limpa na base fixada" >&2
            exit 1
          fi
          git diff --check | tee -a ../rebase-cost.log

      - name: Archive rebase cost log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-rebase-cost
          path: rebase-cost.log

  kernel-build:
    name: Kernel build 6.18 (port Khaje)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Kernel project
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libelf-dev
          # dt-validate para o gate dtbs_check da fatia S1 em diante.
          pip3 install --break-system-packages dtschema

      - name: Clone base Google (commit fixado)
        run: |
          set -o pipefail
          git clone --depth 1 "$BASE_REPO" basegoogle
          cd basegoogle
          git fetch --depth 1 origin "$BASE_COMMIT"
          git checkout "$BASE_COMMIT"
          git rev-parse HEAD

      - name: Apply local patch series 6.18
        run: |
          set -o pipefail
          cd basegoogle
          for p in ../patches-6.18/[0-9][0-9][0-9][0-9]-*.patch; do
            git apply --check "$p" || exit 1
            git apply "$p" || exit 1
          done

      - name: Configure (defconfig GKI + fragmento Khaje)
        run: |
          set -o pipefail
          sh tools/configure_kernel.sh basegoogle 2>&1 | tee basegoogle/configure.log

      - name: Build kernel image
        run: |
          set -o pipefail
          cd basegoogle
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image \
            2>&1 | tee kernel-build-618.log

      # Gate das fatias de DT (docs/dt-upstream-sm6225-plan.md):
      # compila o DTB do topaz e valida contra todos os schemas
      # (CHECK_DTBS=1 num alvo .dtb unico). dtc limpa != schema
      # limpo, e nenhum dos dois e evidencia de boot. NOTA: o make
      # retorna 0 mesmo com erro do dt-validate (visto na run
      # 41052634674), entao o gate grepa o log pelas linhas de
      # reporte do dt-validate para o nosso DTB e falha se houver.
      - name: DTB + dtbs_check (sm6225-xiaomi-topaz)
        run: |
          set -o pipefail
          cd basegoogle
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" \
            CHECK_DTBS=1 qcom/sm6225-xiaomi-topaz.dtb \
            2>&1 | tee dtbs-check-618.log
          if grep -E "sm6225-xiaomi-topaz\.dtb:" dtbs-check-618.log; then
            echo "ERRO: dtbs_check reportou problemas de schema no DTB do topaz" >&2
            exit 1
          fi
          echo "dtbs_check limpo para sm6225-xiaomi-topaz.dtb"

      - name: Archive Image + build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-kernel-build
          path: |
            basegoogle/arch/arm64/boot/Image
            basegoogle/arch/arm64/boot/dts/qcom/sm6225-xiaomi-topaz.dtb
            basegoogle/kernel-build-618.log
            basegoogle/dtbs-check-618.log
            basegoogle/configure.log
            basegoogle/.config

      # Same reporting channel as the 6.12 track: the log tails land in a
      # GitHub issue, readable from environments that cannot download
      # Actions logs/artifacts.
      - name: Publish build summary as issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # NB: grep sai com codigo 2 se algum log nao existe (etapa
          # anterior falhou); sem o "|| true" o pipefail apagava os
          # matches validos grava o fallback por cima.
          { grep -hE 'FALTANDO|^ERRO|error:|Error:|undefined|multiple definition|treated as errors|No rule to make|Error [0-9]|drivers/media.*(warning|error)|s5kjn1|ov08d10|sm6225-xiaomi-topaz\.dtb:' \
              basegoogle/configure.log basegoogle/kernel-build-618.log \
              basegoogle/dtbs-check-618.log || true; } 2>/dev/null \
              | sort -u > basegoogle/falhas.txt
          [ -s basegoogle/falhas.txt ] \
              || echo "(nenhuma falha grepada)" > basegoogle/falhas.txt
          bash tools/ci_publish_report.sh \
            "CI: relatorio de build do kernel 6.18 (port Khaje)" ci-report \
            basegoogle/falhas.txt basegoogle/configure.log \
            basegoogle/kernel-build-618.log basegoogle/dtbs-check-618.log || true

      # Os artefatos do Actions ficam no blob storage do GitHub, que nao
      # e' alcancavel do sandbox do projeto (o zip morre com EOF depois
      # do 302). Um branch publicado pelo CI, esse sim, sai por
      # github.com e pode ser lido com `git fetch`. Mesmo padrao do
      # workflow 6.12: publica Image, DTB, .config e logs em
      # ci-artifacts-6.18. O push e' forcado - cada run substitui o
      # conteudo, sem empilhar 30 MB de Image por rodada no historico.
      # tools/fetch_ci_artifacts.sh traz de volta para o sandbox.
      - name: Publish Image + DTB to ci-artifacts-6.18
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/artefatos
          mkdir -p /tmp/artefatos/logs
          cd /tmp/artefatos
          git init -q
          git config user.email "ci@local"
          git config user.name "CI"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp "$GITHUB_WORKSPACE/basegoogle/arch/arm64/boot/Image" Image || true
          cp "$GITHUB_WORKSPACE/basegoogle/arch/arm64/boot/dts/qcom/sm6225-xiaomi-topaz.dtb" sm6225-xiaomi-topaz.dtb || true
          cp "$GITHUB_WORKSPACE/basegoogle/.config" config-6.18.config || true
          cp "$GITHUB_WORKSPACE/basegoogle/"*.log logs/ || true
          echo "run ${GITHUB_RUN_ID} sha ${GITHUB_SHA}" > RUN
          ls -l Image sm6225-xiaomi-topaz.dtb 2>/dev/null || true
          git add -A
          git commit -q -m "6.18: artefatos da run ${GITHUB_RUN_ID}" || true
          # Publicar artefato e' conveniencia: sem contents:write o
          # push falha e o job nao pode ficar vermelho por isso.
          if git push -f origin HEAD:refs/heads/ci-artifacts-6.18; then
            echo "artefatos 6.18 publicados no branch ci-artifacts-6.18"
          else
            echo "aviso: sem permissao para publicar em ci-artifacts-6.18" >&2
          fi

      # Os artefatos vao para o blob storage do Actions, que nao e'
      # alcancavel de todo ambiente (do sandbox do projeto o zip morre
      # com EOF, so' api.github.com responde). O DTB do topaz tem
      # dezenas de KB: publica-lo em base64 na mesma issue custa dois ou
      # tres comentarios e destrava conferir/montar imagem sem o zip.
      # tools/fetch_dtb.py junta as partes de volta.
      - name: Publish DTB as base64 in the report issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/ci_publish_dtb.sh \
            "CI: relatorio de build do kernel 6.18 (port Khaje)" ci-report \
            basegoogle/arch/arm64/boot/dts/qcom/sm6225-xiaomi-topaz.dtb || true
