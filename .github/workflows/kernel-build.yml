name: kernel-build

# Constroi o kernel topaz sobre a base 6.12 fixada, com a serie de patches locais.
# Job 1 (partial-build): compila so os diretorios tocados pelos patches (rapido, acha erros de C).
# Job 2 (full-build): Image + dtbs completos; so roda se o job 1 passar.
# Nao gera imagem de boot para flash. Nao toca em partições.

on:
  push:
    paths:
      - "patches/**"
      - "configs/**"
      - "tools/**"
      - ".github/workflows/kernel-build.yml"
  pull_request:
    paths:
      - "patches/**"
      - "configs/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 0efd3abd3c356d644ea49f6ed37e9830b78d34e3

jobs:
  partial-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain (clang/LLVM, como a GKI)
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev clang lld llvm python3 libdw-dev dwarves

      - name: Obter a base 6.12 fixada (arvore completa, sem historico)
        run: |
          mkdir "$RUNNER_TEMP/kernel" && cd "$RUNNER_TEMP/kernel"
          git init -q
          git remote add origin https://github.com/EdMory/android_kernel_common_sm8850.git
          git fetch -q --depth=1 origin "$BASE_SHA"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Aplicar a serie de patches locais
        run: |
          cd "$RUNNER_TEMP/kernel"
          for p in "$GITHUB_WORKSPACE"/patches/[0-9][0-9][0-9][0-9]-*.patch; do
            git apply --check "$p" || { echo "::error::patch nao aplica: $(basename "$p")"; exit 1; }
            git apply "$p"
            echo "aplicado: $(basename "$p")"
          done

      - name: Gerar o .config (gki_defconfig + fragmento topaz)
        run: |
          bash tools/check_defconfig.sh "$RUNNER_TEMP/kernel" \
              configs/topaz/topaz.fragment "$RUNNER_TEMP/defconfig"

      - name: Compilar diretorios tocados pelos patches
        run: |
          cd "$RUNNER_TEMP/kernel"
          MAKEARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1"
          rc=0
          LOG="$RUNNER_TEMP/partial-build.log"
          # Sem terminal: resolve simbolos novos por padrao (olddefconfig) antes do prepare,
          # senao o syncconfig pergunta interativamente e morre com "Error in reading or end of file".
          make $MAKEARGS olddefconfig > "$RUNNER_TEMP/olddefconfig.log" 2>&1 || rc=$?
          echo "simbolos NEW restantes apos olddefconfig: $(grep -c '(NEW)' "$RUNNER_TEMP/olddefconfig.log" || true)"
          make $MAKEARGS V=1 -j"$(nproc)" prepare < /dev/null > "$LOG" 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            make $MAKEARGS V=1 -k -j"$(nproc)" \
                drivers/clk/qcom/ drivers/interconnect/qcom/ drivers/pinctrl/qcom/ \
                drivers/phy/qualcomm/ drivers/regulator/ \
                >> "$LOG" 2>&1 || rc=$?
          fi
          if [ "$rc" -ne 0 ]; then
            # Erros reais: diagnosticos do compilador/linker ou linhas "Error N" do make, com 6 linhas antes.
            grep -v -E "HDRINST|headers_install" "$LOG" > "$RUNNER_TEMP/log-sem-ruido.txt"
            # Ignora flags (-Werror), checagens sha1 do prepare e linhas de comando; pega as ULTIMAS ocorrencias (o erro real fica no fim).
            grep -n -E "error:|Error [0-9]|fatal error|No such file|undefined reference|\*\*\* " "$RUNNER_TEMP/log-sem-ruido.txt" \
              | grep -v -E "Werror|sha1sum|CHKSHA|^[0-9]+:  clang|^[0-9]+:# " | tail -n 3 | cut -d: -f1 > "$RUNNER_TEMP/first-errs.txt" || true
            : > "$RUNNER_TEMP/ctx.txt"
            while read -r n; do
              s=$((n > 10 ? n - 10 : 1))
              sed -n "${s},$((n + 1))p" "$RUNNER_TEMP/log-sem-ruido.txt" | cut -c1-200 >> "$RUNNER_TEMP/ctx.txt"
              echo "---" >> "$RUNNER_TEMP/ctx.txt"
            done < "$RUNNER_TEMP/first-errs.txt"
            ctx=$(sed 's/%/%25/g; s/\r/%0D/g' "$RUNNER_TEMP/ctx.txt" | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build parcial rc=$rc (erros e contexto)::$ctx"
            # Diagnosticos do compilador (error:), agrupados e contados, para ver TODOS os arquivos com falha.
            grep -E "error:|fatal error" "$LOG" | cut -c1-220 | sort | uniq -c | sort -rn | head -40 > "$RUNNER_TEMP/diag.txt" || true
            diag=$(sed 's/%/%25/g; s/\r/%0D/g' "$RUNNER_TEMP/diag.txt" | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=diagnosticos do compilador::$diag"
          fi
          exit "$rc"

      - name: Conferir quais .c dos patches foram realmente compilados
        if: always()
        run: |
          cd "$RUNNER_TEMP/kernel"
          git status --porcelain --untracked-files=all | awk '{print $2}' | grep '\.c$' > "$RUNNER_TEMP/patched-c.txt" || true
          : > "$RUNNER_TEMP/objetos-report.txt"
          while read -r f; do
            o="${f%.c}.o"
            if [ -f "$o" ]; then
              echo "OK      $f" >> "$RUNNER_TEMP/objetos-report.txt"
            else
              echo "NAO COMPILADO (fora do .config ou sem regra no Makefile): $f" >> "$RUNNER_TEMP/objetos-report.txt"
              echo "::warning file=$f::arquivo do patch nao foi compilado; verificar Kconfig/Makefile"
            fi
          done < "$RUNNER_TEMP/patched-c.txt"
          cat "$RUNNER_TEMP/objetos-report.txt"

      - name: Resumo do build parcial
        if: always()
        run: |
          {
            echo "### Build parcial do kernel topaz (base 6.12 ${BASE_SHA:0:9})"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/partial-build.log" 2>/dev/null || echo "sem log"
            echo '```'
            echo "### Arquivos de patch"
            echo '```'
            cat "$RUNNER_TEMP/objetos-report.txt" 2>/dev/null || echo "sem relatorio"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar log do build parcial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topaz-kernel-partial
          path: |
            ${{ runner.temp }}/partial-build.log
            ${{ runner.temp }}/objetos-report.txt
            ${{ runner.temp }}/defconfig
          if-no-files-found: warn
          retention-days: 14

  full-build:
    needs: partial-build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain (clang/LLVM, como a GKI)
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev clang lld llvm python3 libdw-dev dwarves

      - name: Obter a base 6.12 fixada (arvore completa, sem historico)
        run: |
          mkdir "$RUNNER_TEMP/kernel" && cd "$RUNNER_TEMP/kernel"
          git init -q
          git remote add origin https://github.com/EdMory/android_kernel_common_sm8850.git
          git fetch -q --depth=1 origin "$BASE_SHA"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Aplicar a serie de patches locais
        run: |
          cd "$RUNNER_TEMP/kernel"
          for p in "$GITHUB_WORKSPACE"/patches/[0-9][0-9][0-9][0-9]-*.patch; do
            git apply --check "$p" || { echo "::error::patch nao aplica: $(basename "$p")"; exit 1; }
            git apply "$p"
            echo "aplicado: $(basename "$p")"
          done

      - name: Gerar o .config (gki_defconfig + fragmento topaz)
        run: |
          bash tools/check_defconfig.sh "$RUNNER_TEMP/kernel" \
              configs/topaz/topaz.fragment "$RUNNER_TEMP/defconfig"

      - name: Ajuste de ambiente - desligar BTF neste build de teste
        run: |
          # O pahole do runner (dwarves do Ubuntu 24.04) falha no BTFIDS com
          # "Reached the limit of per-CPU variables" / "FAILED: load BTF from vmlinux".
          # So para este build de CI: DEBUG_INFO_BTF=n no .config gerado. O fragmento aprovado nao muda.
          cd "$RUNNER_TEMP/kernel"
          scripts/config --file .config -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig < /dev/null > "$RUNNER_TEMP/olddefconfig-full.log" 2>&1
          grep -E "^CONFIG_DEBUG_INFO_BTF=" .config || echo "DEBUG_INFO_BTF desligado (nao aparece no .config)"

      - name: Compilar Image e dtbs
        run: |
          cd "$RUNNER_TEMP/kernel"
          LOG="$RUNNER_TEMP/full-build.log"
          rc=0
          # KCFLAGS=-Wno-error: o clang do runner transforma avisos de -Wframe-larger-than do upstream
          # (bpf/verifier.c, block/loop.c, hid-logitech) em erro via CONFIG_WERROR. Nao e' falha dos patches;
          # os avisos continuam no log. A configuracao do kernel nao muda.
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-error -k -j"$(nproc)" Image dtbs < /dev/null > "$LOG" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -E "error:|fatal error|undefined reference|No such file" "$LOG" | cut -c1-220 | sort | uniq -c | sort -rn | head -40 > "$RUNNER_TEMP/diag-full.txt" || true
            diag=$(sed 's/%/%25/g; s/\r/%0D/g' "$RUNNER_TEMP/diag-full.txt" | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build completo rc=$rc (diagnosticos)::$diag"
            grep -E "\*\*\* " "$LOG" | tail -n 5 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=make-final::$l"; done
            # Ultimas 30 linhas do log (inclui falhas de link/BTF que nao usam 'error:'), numa anotacao so.
            tail -n 30 "$LOG" | cut -c1-200 | sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g' | tail -c 3500 > "$RUNNER_TEMP/tail-full.txt"
            echo "::error title=build completo - ultimas linhas::$(cat "$RUNNER_TEMP/tail-full.txt")"
          fi
          tail -n 3 "$LOG"
          exit "$rc"

      - name: Resumo do build completo
        if: always()
        run: |
          {
            echo "### Build completo do kernel topaz (Image + dtbs)"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/full-build.log" 2>/dev/null || echo "sem log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar Image, dtbs e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topaz-kernel-full
          path: |
            ${{ runner.temp }}/full-build.log
            ${{ runner.temp }}/kernel/arch/arm64/boot/Image
            ${{ runner.temp }}/kernel/arch/arm64/boot/dts/qcom/*.dtb
          if-no-files-found: warn
          retention-days: 7
