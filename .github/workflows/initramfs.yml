name: Minimal initramfs (topaz/tapas)

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - "initramfs/**"
      - "tests/**"
      - "tools/initramfs.py"
      - "tools/check_initramfs.py"
      - ".github/workflows/initramfs.yml"

jobs:
  build:
    name: Ramdisk do boot minimo (init + BusyBox)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Kernel project
        uses: actions/checkout@v4

      - name: Unit tests (CPIO/initramfs)
        run: python3 -m unittest discover -s tests -v

      - name: Install AArch64 toolchain and libc headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross make

      - name: Checkout BusyBox (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: mirror/busybox
          ref: 1a64f6a20aaf6ea4dbba68bbfa8cc1ab7e5c57c4
          path: busybox
          fetch-depth: 1

      - name: Build static BusyBox (AArch64)
        run: |
          set -o pipefail
          cd busybox
          make defconfig
          # O applet tc tenta compilar CBQ removido dos headers UAPI atuais;
          # nao e necessario para o bring-up e fica fora do initramfs.
          sed -i -e 's/^# CONFIG_STATIC is not set$/CONFIG_STATIC=y/' \
                 -e 's/^CONFIG_STATIC=.*/CONFIG_STATIC=y/' \
                 -e 's/^CONFIG_TC=y$/# CONFIG_TC is not set/' .config
          grep -q '^CONFIG_STATIC=y$' .config
          grep -q '^# CONFIG_TC is not set$' .config
          make -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee busybox-build.log
          test -x busybox

      - name: Build minimal init (static AArch64)
        run: |
          set -o pipefail
          mkdir -p /tmp/ramdisk-root/{bin,proc,sys,dev,tmp}
          aarch64-linux-gnu-gcc -static -no-pie -O2 -Wall -Wextra -Werror \
            -o /tmp/ramdisk-root/init initramfs/minimal-init.c 2>&1 | tee init-build.log
          test -x /tmp/ramdisk-root/init

      - name: Assemble and validate ramdisk
        run: |
          set -o pipefail
          cp busybox/busybox /tmp/ramdisk-root/bin/busybox
          # /dev/console must exist before PID 1 starts and mounts devtmpfs.
          sudo mknod -m 600 /tmp/ramdisk-root/dev/console c 5 1
          sudo mknod -m 666 /tmp/ramdisk-root/dev/null c 1 3
          for applet in sh ls cat echo dmesg mount ps grep hexdump dd sleep \
                        uname free df id date env find head tail wc kill \
                        reboot halt poweroff insmod rmmod lsmod; do
            ln -sf busybox "/tmp/ramdisk-root/bin/$applet"
          done
          python3 tools/initramfs.py /tmp/ramdisk-root /tmp/initramfs.cpio | tee ramdisk.log
          python3 tools/check_initramfs.py /tmp/initramfs.cpio | tee -a ramdisk.log

      - name: Publish build report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          bash tools/ci_publish_report.sh \
            "CI: ramdisk do boot minimo (init + BusyBox)" ci-report \
            busybox/busybox-build.log init-build.log ramdisk.log || true

      - name: Publish artifacts to ci-artifacts branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/artifacts
          mkdir -p /tmp/artifacts
          cd /tmp/artifacts
          git init -q
          git config user.email "ci@local"
          git config user.name "CI"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin ci-artifacts 2>/dev/null || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
            git checkout -q FETCH_HEAD -- . || true
          fi
          mkdir -p /tmp/artifacts/initramfs /tmp/artifacts/logs
          cd "$GITHUB_WORKSPACE"
          cp /tmp/initramfs.cpio /tmp/artifacts/initramfs/ 2>/dev/null || true
          cp /tmp/ramdisk-root/init /tmp/artifacts/initramfs/minimal-init 2>/dev/null || true
          cp busybox/busybox /tmp/artifacts/initramfs/busybox 2>/dev/null || true
          cp busybox/busybox-build.log /tmp/artifacts/logs/ 2>/dev/null || true
          cp init-build.log /tmp/artifacts/logs/ 2>/dev/null || true
          cp ramdisk.log /tmp/artifacts/logs/ 2>/dev/null || true
          cd /tmp/artifacts
          git add -A
          git commit -q -m "artefatos initramfs da run ${GITHUB_RUN_ID}" || true
          git push -f origin HEAD:refs/heads/ci-artifacts
          echo "artefatos initramfs publicados em ci-artifacts"

      - name: Archive ramdisk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: initramfs
          path: |
            /tmp/initramfs.cpio
            /tmp/ramdisk-root/init
